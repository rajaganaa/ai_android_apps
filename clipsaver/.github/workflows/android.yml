name: ClipSaver APK

on:
  push:
    tags: ["clipsaver-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: clipsaver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Warm Gradle wrapper (retry on transient download failures)
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Gradle wrapper bootstrap failed after ${attempt} attempts."
              exit 1
            fi
            echo "Gradle wrapper bootstrap failed (attempt ${attempt}). Retrying in 20s..."
            sleep 20
          done

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cd app/build/outputs/apk/release
          ls -la
          UNSIGNED=$(ls *.apk | head -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/upload.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out ClipSaver.apk "$UNSIGNED"
          rm -f "$UNSIGNED" *.idsig
          "$APKSIGNER" verify --verbose ClipSaver.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipsaver-release-apk
          path: clipsaver/app/build/outputs/apk/release/ClipSaver.apk

      - name: Publish GitHub Release (only for tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clipsaver/app/build/outputs/apk/release/ClipSaver.apk
