# Put this file at the TOP LEVEL of your repo: .github/workflows/clipsaver-apk.yml
# (not inside the clipsaver/ folder). Run it by pushing a tag like clipsaver-v1.0.0
name: ClipSaver APK

on:
  push:
    tags: ["clipsaver-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: clipsaver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: clipsaver

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipsaver-release-apk
          path: clipsaver/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (only for tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clipsaver/app/build/outputs/apk/release/*.apk
